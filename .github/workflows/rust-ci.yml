name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'   # daily

defaults:
  run:
    working-directory: sdk/rust

jobs:
# -------------------------------------------------------- #
# 1) TEST su stable / beta / nightly
# -------------------------------------------------------- #
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
        include:
          - rust: stable
            cache-key: stable
          - rust: beta
            cache-key: beta
          - rust: nightly
            cache-key: nightly

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ matrix.rust }}"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.cache-key }}-${{ hashFiles('sdk/rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.cache-key }}-

      # ---------- formatter & clippy solo su stable ----------
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check

      - name: Run clippy (deny warnings)
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets -- -D warnings

      # ---------- test & build ----------
      - name: Run tests
        run: cargo test --verbose
      - name: Build (release)
        run: cargo build --release

# -------------------------------------------------------- #
# 2) ADDITIONAL CHECKS (solo stable)
# -------------------------------------------------------- #
  check:
    name: Additional Checks
    needs: test
    runs-on: ubuntu-latest
    if: always()                # mostra esito anche se test fallisse

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # --- documentation ---------------------------------
      - name: Build docs with warnings denied
        run: |
          # cargo-deadlinks 0.8.x misclassifies modern rustdoc source navigation
          # as broken local links, so rustdoc warnings are the blocking signal.
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

      # --- nightly toolchain per cargo-udeps --------------
      - name: Install nightly Rust (for udeps)
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-udeps
        run: cargo +nightly install cargo-udeps --quiet --locked

      - name: Unused dependency check
        run: cargo +nightly udeps --tests --all-targets
