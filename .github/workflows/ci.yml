# =============================================================================
# AXCP Core CI - Standalone Pipeline
# =============================================================================
# This workflow runs the Core test suite independently of Advanced/Enterprise.
# It validates: Go SDK, Python bindings, Gateway telemetry, Rust SDK, examples.
#
# Recommended required checks: Test Go, Test Python, Test TypeScript,
# Test Gateway Telemetry, Test RPi Agent, Check Examples.
# =============================================================================

name: AXCP CI

on:
  push:
    branches:
      - main
      - 'restructure/open-core'
      - 'chore/ci-go-workspaces'
      - 'fix/ci-*'
      - 'feature/21c-*'
      - 'feat/m4*'
  pull_request:
    branches:
      - main

env:
  GO_VERSION:  '1.25.6'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  PROTOC_VERSION: '33.2'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'

# ------------------------------------------------------------
# 1. Go unit tests
# ------------------------------------------------------------
jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc + plugin
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            -o "${RUNNER_TEMP}/protoc.zip"
          unzip -q "${RUNNER_TEMP}/protoc.zip" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/protoc/bin/protoc" --version
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          "$(go env GOPATH)/bin/protoc-gen-go" --version

      - name: Generate Go stubs
        working-directory: sdk/go
        run: |
          mkdir -p internal/pb
          protoc -I ../../proto \
            --go_out=internal/pb --go_opt=paths=source_relative \
            ../../proto/axcp.proto

      - name: Verify generated Go stubs are committed
        run: git diff --exit-code proto/axcp.proto sdk/go/internal/pb/axcp.pb.go

      - name: Run Go tests
        run: |
          set -euo pipefail
          (cd sdk/go && go test -v -race ./...)
          (cd edge/gateway && go test -v -race ./...)
          (cd edge/rpi-agent && go test -v -race ./...)

      - name: Metrics histogram tests
        run: go test ./edge/gateway/internal/metrics -run TestHistogramObserve,TestOTELBatching

      - name: Code coverage
        working-directory: sdk/go
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      # ── Upload generated protobuf artifacts for reuse ──────────────
      - name: Upload protobuf artifacts
        uses: actions/upload-artifact@v6
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/
          retention-days: 1

# ------------------------------------------------------------ 
# 2️⃣  PYTHON (Budget Go test)  – workspace + mini-mod dp
# ------------------------------------------------------------
  test-python:
    name: Test Python
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e sdk/python
          python -m pip install aioquic pytest-cov

      - name: Generate Python stubs
        run: |
          python -m grpc_tools.protoc -I=proto --python_out=proto proto/axcp.proto
          python -m grpc_tools.protoc -I=proto --python_out=sdk/python/src/axcp/pb proto/axcp.proto

      - name: Verify generated Python stubs are committed
        run: git diff --exit-code proto/axcp_pb2.py sdk/python/src/axcp/pb/axcp_pb2.py

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q scripts gateway sdk/python/tests

      - name: SDK release-readiness check
        run: python scripts/verify_sdk_release_readiness.py

      - name: QUIC RTT micro-bench
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: python bench/quic/rtt_bench.py 20

      - name: Codec benchmarks (Go quick)
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: sdk/go
        run: go test ./... -bench=. -benchtime=1x -benchmem

# ------------------------------------------------------------
# 2b. TypeScript SDK core
# ------------------------------------------------------------
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK deps
        working-directory: sdk/typescript
        run: npm ci

      - name: Type-check TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run TypeScript SDK tests
        working-directory: sdk/typescript
        run: npm test

      - name: Verify TypeScript package contents
        working-directory: sdk/typescript
        run: npm pack --dry-run

# ------------------------------------------------------------ 
# 3. Gateway telemetry integration
# ------------------------------------------------------------
  test-gateway-telemetry:
    name: Test Gateway Telemetry
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gateway telemetry tests
        run: |
          set -e
          (cd edge/gateway && go test -v -race ./...)
          (cd sdk/go && go test -v -run Test.*Telemetry ./axcp/...)

      - name: Run Prometheus metrics tests
        run: |
          set -e
          (cd edge/gateway && go test -v -race ./internal/metrics/... -run TestPrometheusMetrics)

# ------------------------------------------------------------
# 4. RPi Agent using generated stubs and a Go workspace
# ------------------------------------------------------------
  test-rpi-agent:
    name: Test RPi Agent
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ── workspace per rpi-agent <-> sdk/go -----------------------
      - name: Create Go workspace for rpi-agent
        run: |
          go work init ./sdk/go ./edge/rpi-agent || true
          go work use  ./sdk/go ./edge/rpi-agent

      # Run agent tests.
      - name: Run rpi-agent tests
        working-directory: edge/rpi-agent
        run: go test -v -race ./...

# ------------------------------------------------------------ 
# 5. Examples build check
# ------------------------------------------------------------
  check-examples:
    name: Check Examples
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build simple_chat example
        working-directory: examples/go/simple_chat
        run: |
          go vet .
          go test -c -o /tmp/simple_chat.test
