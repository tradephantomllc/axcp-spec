# =============================================================================
# AXCP Core CI - Standalone Pipeline
# =============================================================================
# This workflow runs the Core test suite independently of Advanced/Enterprise.
# It validates: Go SDK, Python bindings, Gateway telemetry, TypeScript SDK, examples.
#
# Recommended required checks: Test Go, Test Python, Test TypeScript,
# Test Gateway Telemetry, Test RPi Agent, Check Examples.
# =============================================================================

name: AXCP CI

on:
  push:
    branches:
      - main
      - 'restructure/open-core'
      - 'chore/ci-go-workspaces'
      - 'fix/ci-*'
      - 'feature/21c-*'
      - 'feat/m4*'
  pull_request:
    branches:
      - main

env:
  GO_VERSION:  '1.26.9'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  PROTOC_VERSION: '33.2'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'

# ------------------------------------------------------------
# 1. Go unit tests
# ------------------------------------------------------------
jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc + plugin
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            -o "${RUNNER_TEMP}/protoc.zip"
          unzip -q "${RUNNER_TEMP}/protoc.zip" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/protoc/bin/protoc" --version
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          "$(go env GOPATH)/bin/protoc-gen-go" --version

      - name: Generate Go stubs
        working-directory: sdk/go
        run: |
          mkdir -p internal/pb
          protoc -I ../../proto \
            --go_out=internal/pb --go_opt=paths=source_relative \
            ../../proto/axcp.proto

      - name: Verify generated Go stubs are committed
        run: git diff --exit-code proto/axcp.proto sdk/go/internal/pb/axcp.pb.go

      - name: Run Go tests
        run: |
          set -euo pipefail
          (cd sdk/go && go test -v -race ./...)
          (cd edge/gateway && go test -v -race ./...)
          (cd edge/rpi-agent && go test -v -race ./...)
          go test -race ./... ./test/...

      - name: Build an external Go SDK consumer
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          cd "${consumer_dir}"
          go mod init axcp-install-check
          go mod edit -require=github.com/tradephantomllc/axcp-spec/sdk/go@v0.0.0
          go mod edit -replace="github.com/tradephantomllc/axcp-spec/sdk/go=${GITHUB_WORKSPACE}/sdk/go"
          cat > main.go <<'GO'
          package main
          import (
            _ "github.com/tradephantomllc/axcp-spec/sdk/go/axcp"
            _ "github.com/tradephantomllc/axcp-spec/sdk/go/axcp/pb"
            _ "github.com/tradephantomllc/axcp-spec/sdk/go/netquic"
          )
          func main() {}
          GO
          go mod tidy
          go build .

      - name: Metrics histogram tests
        run: go test ./edge/gateway/internal/metrics -run 'TestHistogramObserve|TestOTELBatching'

      - name: Code coverage
        working-directory: sdk/go
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      # ── Upload generated protobuf artifacts for reuse ──────────────
      - name: Upload protobuf artifacts
        uses: actions/upload-artifact@v6
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/
          retention-days: 1

# ------------------------------------------------------------ 
# 2️⃣  PYTHON (Budget Go test)  – workspace + mini-mod dp
# ------------------------------------------------------------
  test-python:
    name: Test Python
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e sdk/python
          python -m pip install aioquic pytest-cov

      - name: Install pinned protoc
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            -o "${RUNNER_TEMP}/protoc.zip"
          unzip -q "${RUNNER_TEMP}/protoc.zip" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >> "${GITHUB_PATH}"

      - name: Generate Python stubs
        run: |
          protoc -I=proto --python_out=proto proto/axcp.proto
          protoc -I=proto --python_out=sdk/python/src/axcp/pb proto/axcp.proto

      - name: Verify generated Python stubs are committed
        run: git diff --exit-code proto/axcp_pb2.py sdk/python/src/axcp/pb/axcp_pb2.py

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q scripts gateway sdk/python/tests

      - name: Install and smoke-test the Python wheel outside the checkout
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          python -m pip wheel --no-deps ./sdk/python --wheel-dir "${package_dir}"
          python -m venv "${package_dir}/venv"
          "${package_dir}/venv/bin/python" -m pip install "${package_dir}"/*.whl
          cd "${package_dir}"
          "${package_dir}/venv/bin/python" - <<'PYTHON'
          from axcp import Agent, Identity, encode_envelope, decode_envelope
          from axcp.pb import axcp_pb2
          alice, bob = Agent(Identity.generate()), Agent(Identity.generate())
          envelope = alice.new_envelope(trace_id="wheel-install")
          envelope.context_patch.CopyFrom(axcp_pb2.ContextPatch(context_id="ctx", base_version=1))
          alice.sign_message(envelope, recipient_did=bob.identity.did)
          bob.verify(decode_envelope(encode_envelope(envelope)))
          PYTHON

      - name: SDK release-readiness check
        run: python scripts/verify_sdk_release_readiness.py

      - name: QUIC RTT micro-bench
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: python bench/quic/rtt_bench.py 20

      - name: Codec benchmarks (Go quick)
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: sdk/go
        run: go test ./... -bench=. -benchtime=1x -benchmem

# ------------------------------------------------------------
# 2b. TypeScript SDK core
# ------------------------------------------------------------
  test-python-sdk-compat:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install packaged SDK and tests
        run: python -m pip install ./sdk/python pytest
      - name: Check minimum transport and protobuf dependencies
        if: matrix.python == '3.10'
        run: python -m pip install 'aioquic==1.3.0' 'protobuf==6.33.5'
      - name: Test SDK compatibility
        run: python -m pytest -q sdk/python/tests

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK deps
        working-directory: sdk/typescript
        run: npm ci

      - name: Type-check TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run TypeScript SDK tests
        working-directory: sdk/typescript
        run: npm test

      - name: Install and smoke-test the TypeScript tarball outside the checkout
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          npm pack --pack-destination "${consumer_dir}"
          cd "${consumer_dir}"
          npm init -y
          npm install --ignore-scripts ./*.tgz
          node --input-type=module - <<'JS'
          import { Agent, Identity, encodeEnvelope, decodeEnvelope } from '@tradephantom/axcp';
          import { TlsClient } from '@tradephantom/axcp/transport';
          import * as pb from '@tradephantom/axcp/pb';
          const alice = new Agent(Identity.generate()), bob = new Agent(Identity.generate());
          const envelope = alice.newEnvelope({traceId:'tarball-install'});
          envelope.contextPatch = {contextId:'ctx',baseVersion:1,ops:[]};
          alice.signMessage(envelope,{recipientDid:bob.identity.did});
          await bob.verify(decodeEnvelope(encodeEnvelope(envelope)));
          if (typeof TlsClient.connect !== 'function' || !Object.keys(pb).length) throw new Error('missing exports');
          JS

# ------------------------------------------------------------ 
# 3. Gateway telemetry integration
# ------------------------------------------------------------
  test-gateway-telemetry:
    name: Test Gateway Telemetry
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gateway telemetry tests
        run: |
          set -e
          (cd edge/gateway && go test -v -race ./...)
          (cd sdk/go && go test -v -run Test.*Telemetry ./axcp/...)

      - name: Run Prometheus metrics tests
        run: |
          set -e
          (cd edge/gateway && go test -v -race ./internal/metrics/... -run TestPrometheusMetrics)

# ------------------------------------------------------------
# 4. RPi Agent using generated stubs and a Go workspace
# ------------------------------------------------------------
  test-rpi-agent:
    name: Test RPi Agent
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Download protobuf artifacts from test-go job ──────────────
      - name: Download protobuf artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-protobuf-stubs
          path: sdk/go/internal/pb/

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ── workspace per rpi-agent <-> sdk/go -----------------------
      - name: Create Go workspace for rpi-agent
        run: |
          go work init ./sdk/go ./edge/rpi-agent || true
          go work use  ./sdk/go ./edge/rpi-agent

      # Run agent tests.
      - name: Run rpi-agent tests
        working-directory: edge/rpi-agent
        run: go test -v -race ./...

# ------------------------------------------------------------ 
# 5. Examples build check
# ------------------------------------------------------------
  check-examples:
    name: Check Examples
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set-up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build simple_chat example
        working-directory: examples/go/simple_chat
        run: |
          go vet .
          go test -c -o /tmp/simple_chat.test
