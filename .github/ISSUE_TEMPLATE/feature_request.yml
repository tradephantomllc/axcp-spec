name: "Feature request"
description: Suggest an improvement to AXCP Core.
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      description: Describe the problem or use case this feature would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like, including any protocol or compatibility impact.
    validations:
      required: false
